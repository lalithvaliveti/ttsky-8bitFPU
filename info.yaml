# Tiny Tapeout project information
project:
  title:        "8bitFPU"      # Project title
  author:       "Lalith"      # Your name
  discord:      "Lalith"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A Floating point unit"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_8bitFPU"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_8bitFPU.sv"
    - "fp8_fpu_e4m3.sv"
    - "fp8_fma_e4m3.sv"
    - "fp8_div_e4m3.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Data bit 0"
  ui[1]: "Data bit 1"
  ui[2]: "Data bit 2"
  ui[3]: "Data bit 3"
  ui[4]: "Data bit 4"
  ui[5]: "Data bit 5"
  ui[6]: "Data bit 6"
  ui[7]: "Data bit 7 (sign)"

  # Outputs
  uo[0]: "Result bit 0"
  uo[1]: "Result bit 1"
  uo[2]: "Result bit 2"
  uo[3]: "Result bit 3"
  uo[4]: "Result bit 4"
  uo[5]: "Result bit 5"
  uo[6]: "Result bit 6"
  uo[7]: "Result bit 7 (sign)"

  # Bidirectional pins
  uio[0]: "Load (in) / Valid (out)"
  uio[1]: "Execute (in) / Error (out)"
  uio[2]: "Opcode[0] (in) / Busy (out)"
  uio[3]: "Opcode[1] (in)"
  uio[4]: "Opcode[2] (in)"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
# Do not change!
yaml_version: 6
